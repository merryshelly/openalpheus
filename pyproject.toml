[project]
name = "openalph"
version = "0.1.0"
description = "Purpose-built multi-agent AI platform"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.49",
    "openai>=1.60",
    "matrix-nio>=0.25",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
