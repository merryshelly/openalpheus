[project]
name = "openalph"
version = "0.1.0"
description = "Purpose-built multi-agent AI platform"
license = "AGPL-3.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic==0.84.0",
    "openai==2.26.0",
    "matrix-nio==0.25.2",
    "mistune==3.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
]

[project.scripts]
openalph = "openalph.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openalph = ["templates/*.md", "templates/skills/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
