# Smoke test config — quick validation against a local homeserver
# Uses Anthropic Sonnet for cheap testing

[agent]
name = "myagent"
model = "claude-sonnet-4-20250514"
max_tokens = 4096

[provider]
type = "anthropic"
api_key_cmd = "op read 'op://<your-vault>/anthropic/api-key'"

[workspace]
path = "/tmp/openalph-smoke-test"

[matrix]
homeserver = "http://127.0.0.1:4269"
user_id = "@myagent:example.com"
device_id = "OPENALPH"
password_cmd = "op read 'op://<your-vault>/matrix-agent/password'"
