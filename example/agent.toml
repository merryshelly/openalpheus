# Example: Anthropic agent
[agent]
name = "merry"
model = "claude-sonnet-4-20250514"
max_tokens = 8192

[provider]
type = "anthropic"
# Exactly one of: api_key, api_key_env, api_key_cmd
# api_key = "sk-ant-..."                          # direct (not recommended)
api_key_cmd = "op read op://shelly/anthropic/api-key"  # shell command
# api_key_env = "ANTHROPIC_API_KEY"               # env var

[workspace]
path = "/home/merry/.openalph/workspace"

